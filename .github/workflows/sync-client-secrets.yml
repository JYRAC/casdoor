name: Sync Casdoor client secrets

# Casdoor のアプリ(OIDCクライアント)のシークレットを正とし、
# OpenBao の KV(各アプリ用)と OpenBao 自身の OIDC 設定へ流す。
#   sync   : Casdoor の現在値をそのまま反映(ズレの修復)
#   rotate : 新しい値を生成 → Casdoor更新 → 反映。失敗したら Casdoor を元に戻す

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "sync = 現在値を反映 / rotate = 新しい値に更新"
        type: choice
        options: [sync, rotate]
        default: sync
      only:
        description: "対象アプリを1つに絞る(空なら全件)"
        type: string
        default: ""

permissions:
  id-token: write
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync client secrets
        env:
          MODE: ${{ inputs.mode }}
          ONLY: ${{ inputs.only }}
        run: |
          set -euo pipefail
          BAO=https://openbao.jyrac.stki.org
          CASDOOR=https://auth.jyrac.stki.org
          ORG=admin
          MODE="${MODE:-sync}"

          # 名前(Casdoorのアプリ名) | 種別 | パス | キー   ※要調整
          APPS='
          vikunja|kv|secrets/vikunja/config|casdoor_client_secret
          directus|kv|secrets/directus/config|casdoor_client_secret
          vaultwarden|kv|secrets/vaultwarden/config|sso_client_secret
          openbao|oidc|auth/oidc/config|oidc_client_secret
          pr_portal|cf|jyrac-pr|CASDOOR_CLIENT_SECRET
          '

          # --- OpenBao へログイン(専用ロール casdoor-sync) ---
          JWT=$(curl -sH "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$BAO" | jq -r .value)
          echo "::add-mask::$JWT"
          TOKEN=$(curl -s -X POST \
            -d "$(jq -n --arg j "$JWT" '{role:"casdoor-sync",jwt:$j}')" \
            "$BAO/v1/auth/jwt/login" | jq -r .auth.client_token)
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "::error::OpenBao login failed"; exit 1
          fi
          echo "::add-mask::$TOKEN"

          # --- Casdoor 管理用アプリの資格情報を KV から取得 ---
          ADMIN=$(curl -sf -H "X-Vault-Token: $TOKEN" \
            "$BAO/v1/kv/data/secrets/casdoor/admin-client" | jq -c .data.data)
          AID=$(jq -r .client_id <<<"$ADMIN")
          ASEC=$(jq -r .client_secret <<<"$ADMIN")
          echo "::add-mask::$ASEC"

          # --- Cloudflare の資格情報(cf 種別のときだけ使う。未登録でも他の種別は動く) ---
          CF=$(curl -s -H "X-Vault-Token: $TOKEN" \
            "$BAO/v1/kv/data/secrets/casdoor/cloudflare" | jq -c '.data.data // {}')
          CF_API_TOKEN=$(jq -r '.api_token // empty' <<<"$CF")
          CF_ACCOUNT_ID=$(jq -r '.account_id // empty' <<<"$CF")
          if [ -n "$CF_API_TOKEN" ]; then echo "::add-mask::$CF_API_TOKEN"; fi

          cas() { curl -sf --max-time 90 --retry 2 --retry-all-errors -u "$AID:$ASEC" "$@"; }

          get_app() { cas "$CASDOOR/api/get-application?id=$ORG/$1" | jq -e '.data'; }

          put_app() {
            cas -X POST -H 'Content-Type: application/json' -d "$2" \
              "$CASDOOR/api/update-application?id=$ORG/$1" | jq -e '.status=="ok"' >/dev/null
          }

          # KV v2 は PUT だと他のキーが消えるため、PATCH(merge-patch)で対象キーだけ更新する
          kv_patch() { # path key new prev
            curl -sf -X PATCH -H "X-Vault-Token: $TOKEN" \
              -H 'Content-Type: application/merge-patch+json' \
              -d "$(jq -n --arg k "$2" --arg n "$3" --arg o "$4" \
                '{data: ({($k):$n} + (if $o=="" then {} else {($k+"_prev"):$o} end))}')" \
              "$BAO/v1/kv/data/$1" >/dev/null
          }

          # OpenBao の OIDC 設定は部分更新できない前提で、読み出し→secretだけ差し替え→書き戻し
          oidc_update() { # path new
            CUR=$(curl -sf -H "X-Vault-Token: $TOKEN" "$BAO/v1/$1" | jq -c .data)
            curl -sf -X POST -H "X-Vault-Token: $TOKEN" \
              -d "$(jq -c --arg s "$2" 'del(.status) | with_entries(select(.value != null)) + {oidc_client_secret:$s}' <<<"$CUR")" \
              "$BAO/v1/$1" >/dev/null
          }

          # Cloudflare Worker のシークレットを1件だけ更新する(他の変数には触れない)
          cf_secret() { # script name value
            if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ACCOUNT_ID" ]; then
              echo "Cloudflare credentials not found in OpenBao" >&2; return 1
            fi
            curl -sf -X PUT -H "Authorization: Bearer $CF_API_TOKEN" \
              -H 'Content-Type: application/json' \
              -d "$(jq -n --arg n "$2" --arg v "$3" '{name:$n,text:$v,type:"secret_text"}')" \
              "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/scripts/$1/secrets" \
              | jq -e '.success==true' >/dev/null
          }

          write_target() {
            case "$TYPE" in
              oidc) oidc_update "$P" "$NEW" ;;
              cf)   cf_secret "$P" "$KEY" "$NEW" ;;
              *)    kv_patch "$P" "$KEY" "$NEW" "$PREV" ;;
            esac
          }

          FAIL=0
          while IFS='|' read -r NAME TYPE P KEY; do
            NAME=$(echo "$NAME" | xargs)
            [ -z "$NAME" ] && continue
            if [ -n "${ONLY:-}" ] && [ "$ONLY" != "$NAME" ]; then continue; fi
            echo "== $NAME ($MODE)"

            if ! APP=$(get_app "$NAME"); then
              echo "::error::$NAME: Casdoor get-application failed"; FAIL=1; continue
            fi
            OLD=$(jq -r .clientSecret <<<"$APP")
            echo "::add-mask::$OLD"

            if [ "$MODE" = rotate ]; then
              NEW=$(openssl rand -hex 20); echo "::add-mask::$NEW"; PREV="$OLD"
              if ! put_app "$NAME" "$(jq -c --arg s "$NEW" '.clientSecret=$s' <<<"$APP")" \
                 || [ "$(get_app "$NAME" | jq -r .clientSecret)" != "$NEW" ]; then
                echo "::error::$NAME: Casdoor update failed, restoring"
                put_app "$NAME" "$APP" || true
                FAIL=1; continue
              fi
            else
              NEW="$OLD"; PREV=""
            fi

            if ! write_target; then
              echo "::error::$NAME: OpenBao write failed"
              if [ "$MODE" = rotate ]; then
                echo "restoring Casdoor to the previous secret"
                put_app "$NAME" "$APP" || echo "::error::$NAME: RESTORE FAILED - fix manually"
              fi
              FAIL=1; continue
            fi
            echo "$NAME: done"
          done <<< "$APPS"

          exit $FAIL
