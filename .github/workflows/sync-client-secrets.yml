name: Sync Casdoor client secrets

# Casdoor のアプリ(OIDCクライアント)のシークレットを正とし、
# OpenBao の KV(各アプリ用)と OpenBao 自身の OIDC 設定へ流す。
#   sync   : Casdoor の現在値をそのまま反映(ズレの修復)
#   rotate : 新しい値を生成 → Casdoor更新 → 反映。失敗したら Casdoor を元に戻す

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "sync = 現在値を反映 / rotate = 新しい値に更新"
        type: choice
        options: [sync, rotate]
        default: sync
      only:
        description: "対象アプリを1つに絞る(空なら全件)"
        type: string
        default: ""
      require_netbird:
        description: "true = NetBird に出られなければ、公開側へ戻らず失敗する(NetBird 経由の確認用。C6 のあとは true 固定にする)"
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

env:
  OPENBAO_NB_IP: "100.125.124.43"
  OPENBAO_NB_NAME: "openbao.netbird.cloud"
  OPENBAO_NB_PORT: "8210"
  CASDOOR_NB_IP: "100.125.23.8"
  CASDOOR_NB_NAME: "auth.jyrac.stki.org"
  CASDOOR_NB_PORT: "8444"   # Casdoor の内部口 B(管理 API。get-application と update-application だけ)

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # OpenBao(8210)と Casdoor の内部口 B(8444)に、NetBird 経由でつなぐ。
      # 両方に、TLS 1.3 で届き、証明書を検証できたときだけ NB_UP=1 にする。どちらかでも届かなければ、公開側へ戻る
      # (移行中の代替。require_netbird=true なら、戻らずに失敗する)。
      # 検証は、切らない。信頼するのは、下のバンドルだけ(旧い OpenBao の自己署名 + ルート。各アプリの openbao/ca.crt と同じもの)。
      - name: Connect to NetBird
        env:
          NB_SETUP_KEY_ACTIONS: ${{ secrets.NETBIRD_SETUP_KEY_ACTIONS }}
          REQUIRE_NETBIRD: ${{ inputs.require_netbird }}
        run: |
          set +e
          NB_VER=0.81.5
          fail() {
            if [ "${REQUIRE_NETBIRD:-false}" = "true" ]; then
              echo "::error::NetBird に接続できませんでした: $1(require_netbird=true のため、公開側へは戻りません)"
              sudo netbird down >/dev/null 2>&1
              exit 1
            fi
            echo "::warning::NetBird に接続できませんでした: $1(公開側に接続します)"
            sudo netbird down >/dev/null 2>&1
            exit 0
          }
          if [ -z "${NB_SETUP_KEY_ACTIONS:-}" ]; then
            fail "NETBIRD_SETUP_KEY_ACTIONS が未設定です"
          fi
          echo "::add-mask::$NB_SETUP_KEY_ACTIONS"

          # 信頼する証明書(公開情報)
          cat > /tmp/openbao-ca.crt <<'PEM'
          -----BEGIN CERTIFICATE-----
          MIIBuDCCAV6gAwIBAgIUGrPzmEUmBP5KAGnQZVeUgsrpOyowCgYIKoZIzj0EAwIw
          IDEeMBwGA1UEAwwVb3BlbmJhby5uZXRiaXJkLmNsb3VkMB4XDTI2MTExMDAzNDIy
          MFoXDTI3MTExMDAzNDIyMFowIDEeMBwGA1UEAwwVb3BlbmJhby5uZXRiaXJkLmNs
          b3VkMFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEYHp7reFD9TWjQrS3Bb0e4S4L
          DHF59f9xSNVHgy8NVduUdi2Y16JvWOXRvphyNf0UQ4ogD5apIKnnYUWPWbnlp6N2
          MHQwDAYDVR0TAQH/BAIwADAOBgNVHQ8BAf8EBAMCB4AwEwYDVR0lBAwwCgYIKwYB
          BQUHAwEwIAYDVR0RBBkwF4IVb3BlbmJhby5uZXRiaXJkLmNsb3VkMB0GA1UdDgQW
          BBTPdnfkV+COni53ttlizaut+Vel2jAKBggqhkjOPQQDAgNIADBFAiEAttmWJRc7
          X6zYBLJKDp13ENef8AcYj2UZ3l7Jic7LWjwCIDMcO2Ip5dyCRJvLXSQvyvBifIj0
          eWX6nDBMkDHcyRru
          -----END CERTIFICATE-----
          -----BEGIN CERTIFICATE-----
          MIIB5zCCAW2gAwIBAgIUW3xodfPKDDQr0wfLWGeU5dBAub0wCgYIKoZIzj0EAwMw
          GDEWMBQGA1UEAwwNanlyYWMgUm9vdCBDQTAeFw0yNjExMTQxNTM5MjJaFw0zNjEx
          MTExNTM5MjJaMBgxFjAUBgNVBAMMDWp5cmFjIFJvb3QgQ0EwdjAQBgcqhkjOPQIB
          BgUrgQQAIgNiAAS1yQ3cQQSKdY662l7QWHEFMpR5P01V0o3hqLedFr/QKdor6cXz
          /P0rLtAUPcEkEcFROz+sCuOKU7lCMZXZF6W0lWcJiizYNL8pjoFLTL4b5YleoeZ5
          jdtDX+XsKS4NPtOjeDB2MBIGA1UdEwEB/wQIMAYBAf8CAQEwDgYDVR0PAQH/BAQD
          AgEGMDEGA1UdHgEB/wQnMCWgIzAPgg1uZXRiaXJkLmNsb3VkMBCCDmp5cmFjLnN0
          a2kub3JnMB0GA1UdDgQWBBT734stIBlBbHrGyFqly0xugmM4JDAKBggqhkjOPQQD
          AwNoADBlAjEAg/CA4HRxBUqGZe2PCT4bo9D8kZUgWq7icxu7ejBJ7qY2w07G6OQ7
          mS+HnExgbCfIAjB7TT/XPbE0fMpESsc0QsgDwVoK0b2E8vGHPb22ozJ5fkD+ml1E
          aBagoOVVZsY4z/A=
          -----END CERTIFICATE-----
          PEM

          curl -fsSL -o /tmp/netbird.tgz \
            "https://github.com/netbirdio/netbird/releases/download/v${NB_VER}/netbird_${NB_VER}_linux_amd64.tar.gz" || fail "ダウンロード"
          tar -xzf /tmp/netbird.tgz -C /tmp netbird || fail "展開"
          sudo install -m 0755 /tmp/netbird /usr/local/bin/netbird
          sudo netbird service install >/dev/null 2>&1
          sudo netbird service start || fail "サービスの起動"

          # DNS には触らせない(ランナーの名前解決を変えない)。ホスト名は、ピアの一覧で見分けるため。
          sudo netbird up --setup-key "$NB_SETUP_KEY_ACTIONS" \
            --hostname "gh-${GITHUB_REPOSITORY##*/}-${GITHUB_RUN_ID}" --disable-dns \
            > /tmp/nb-up.log 2>&1 || { tail -n 5 /tmp/nb-up.log; fail "netbird up"; }

          # 両方に届くまで待つ(最大60秒)。応答の中身(HTTP の値)は問わない。000 = 接続か、TLS の検証の失敗。
          # Casdoor の内部口 B は、許可した 2 つの API 以外は 403 を返すので、403 でも、届いている。
          probe() { # url resolve
            curl -s -o /dev/null -w '%{http_code}' --max-time 5 --proto '=https' --tlsv1.3 \
              --cacert /tmp/openbao-ca.crt --resolve "$2" "$1"
          }
          OK_BAO=0; OK_CAS=0
          for i in $(seq 1 30); do
            if [ "$OK_BAO" != 1 ]; then
              code=$(probe "https://${OPENBAO_NB_NAME}:${OPENBAO_NB_PORT}/v1/sys/health" "${OPENBAO_NB_NAME}:${OPENBAO_NB_PORT}:${OPENBAO_NB_IP}")
              if [ "$code" != "000" ]; then OK_BAO=1; echo "NB: OpenBao に届きました (HTTP $code)"; fi
            fi
            if [ "$OK_CAS" != 1 ]; then
              code=$(probe "https://${CASDOOR_NB_NAME}:${CASDOOR_NB_PORT}/" "${CASDOOR_NB_NAME}:${CASDOOR_NB_PORT}:${CASDOOR_NB_IP}")
              if [ "$code" != "000" ]; then OK_CAS=1; echo "NB: Casdoor の内部口 B に届きました (HTTP $code)"; fi
            fi
            if [ "$OK_BAO" = 1 ] && [ "$OK_CAS" = 1 ]; then
              echo "NB_UP=1" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 2
          done
          [ "$OK_BAO" = 1 ] || fail "OpenBao に届きません(ポリシー、証明書、OpenBao の起動を確認)"
          fail "Casdoor の内部口 B に届きません(ポリシー actions→casdoor:8444、Casdoor の固定ピアの起動、証明書を確認)"

      - name: Sync client secrets
        env:
          MODE: ${{ inputs.mode }}
          ONLY: ${{ inputs.only }}
          REQUIRE_NETBIRD: ${{ inputs.require_netbird }}
        run: |
          set -euo pipefail
          # BAO_AUD は、JWT の audience(OpenBao のロール casdoor-sync の bound_audiences)。接続先ではない。
          # 接続先は、NetBird に参加できていれば NetBird 経由、できていなければ公開側。
          BAO_AUD=https://openbao.jyrac.stki.org
          BAO="$BAO_AUD"
          CASDOOR=https://auth.jyrac.stki.org
          BAO_OPTS=(--max-time 60)
          CAS_OPTS=(--max-time 90 --retry 2 --retry-all-errors)
          if [ "${NB_UP:-}" = "1" ]; then
            # --cacert を付けた curl は、そのバンドルだけを信頼する(システムの CA は使わない)。
            # だから、OpenBao と Casdoor の呼び出しだけに付ける。GitHub と Cloudflare の呼び出しには、付けない。
            BAO="https://${OPENBAO_NB_NAME}:${OPENBAO_NB_PORT}"
            CASDOOR="https://${CASDOOR_NB_NAME}:${CASDOOR_NB_PORT}"
            BAO_OPTS+=(--proto '=https' --tlsv1.3 --cacert /tmp/openbao-ca.crt
              --resolve "${OPENBAO_NB_NAME}:${OPENBAO_NB_PORT}:${OPENBAO_NB_IP}")
            CAS_OPTS+=(--proto '=https' --tlsv1.3 --cacert /tmp/openbao-ca.crt
              --resolve "${CASDOOR_NB_NAME}:${CASDOOR_NB_PORT}:${CASDOOR_NB_IP}")
            echo "OpenBao と Casdoor: NetBird 経由で接続します"
          else
            if [ "${REQUIRE_NETBIRD:-false}" = "true" ]; then
              echo "::error::NetBird に接続していません(require_netbird=true)"; exit 1
            fi
            echo "::warning::NetBird 経由ではなく、公開側の OpenBao と Casdoor に接続します"
          fi
          bao_curl() { curl -sS "${BAO_OPTS[@]}" "$@"; }
          ORG=admin
          MODE="${MODE:-sync}"

          # 名前(Casdoorのアプリ名) | 種別 | パス | キー   ※要調整
          APPS='
          vikunja|kv|secrets/vikunja/config|casdoor_client_secret
          directus|kv|secrets/directus/config|casdoor_client_secret
          vaultwarden|kv|secrets/vaultwarden/config|sso_client_secret
          openbao|oidc|auth/oidc/config|oidc_client_secret
          pr_portal|cf|jyrac-pr|CASDOOR_CLIENT_SECRET
          '

          # --- OpenBao へログイン(専用ロール casdoor-sync) ---
          # GitHub の OIDC トークン(GitHub への呼び出しなので、システムの CA で、そのまま)
          JWT=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$BAO_AUD" | jq -r .value)
          echo "::add-mask::$JWT"
          TOKEN=$(bao_curl -X POST \
            -d "$(jq -n --arg j "$JWT" '{role:"casdoor-sync",jwt:$j}')" \
            "$BAO/v1/auth/jwt/login" | jq -r '.auth.client_token // empty') || true
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "::error::OpenBao login failed"; exit 1
          fi
          echo "::add-mask::$TOKEN"

          # --- Casdoor 管理用アプリの資格情報を KV から取得 ---
          ADMIN=$(bao_curl -f -H "X-Vault-Token: $TOKEN" \
            "$BAO/v1/kv/data/secrets/casdoor/admin-client" | jq -c .data.data)
          AID=$(jq -r .client_id <<<"$ADMIN")
          ASEC=$(jq -r .client_secret <<<"$ADMIN")
          echo "::add-mask::$ASEC"

          # --- Cloudflare の資格情報(cf 種別のときだけ使う。未登録でも他の種別は動く) ---
          CF=$(bao_curl -H "X-Vault-Token: $TOKEN" \
            "$BAO/v1/kv/data/secrets/casdoor/cloudflare" | jq -c '.data.data // {}' || echo '{}')
          CF_API_TOKEN=$(jq -r '.api_token // empty' <<<"$CF")
          CF_ACCOUNT_ID=$(jq -r '.account_id // empty' <<<"$CF")
          if [ -n "$CF_API_TOKEN" ]; then echo "::add-mask::$CF_API_TOKEN"; fi

          cas() { curl -sSf "${CAS_OPTS[@]}" -u "$AID:$ASEC" "$@"; }

          get_app() { cas "$CASDOOR/api/get-application?id=$ORG/$1" | jq -e '.data'; }

          put_app() {
            cas -X POST -H 'Content-Type: application/json' -d "$2" \
              "$CASDOOR/api/update-application?id=$ORG/$1" | jq -e '.status=="ok"' >/dev/null
          }

          # KV v2 は PUT だと他のキーが消えるため、PATCH(merge-patch)で対象キーだけ更新する
          kv_patch() { # path key new prev
            bao_curl -f -X PATCH -H "X-Vault-Token: $TOKEN" \
              -H 'Content-Type: application/merge-patch+json' \
              -d "$(jq -n --arg k "$2" --arg n "$3" --arg o "$4" \
                '{data: ({($k):$n} + (if $o=="" then {} else {($k+"_prev"):$o} end))}')" \
              "$BAO/v1/kv/data/$1" >/dev/null
          }

          # OpenBao の OIDC 設定は部分更新できない前提で、読み出し→secretだけ差し替え→書き戻し
          oidc_update() { # path new
            CUR=$(bao_curl -f -H "X-Vault-Token: $TOKEN" "$BAO/v1/$1" | jq -c .data)
            bao_curl -f -X POST -H "X-Vault-Token: $TOKEN" \
              -d "$(jq -c --arg s "$2" 'del(.status) | with_entries(select(.value != null)) + {oidc_client_secret:$s}' <<<"$CUR")" \
              "$BAO/v1/$1" >/dev/null
          }

          # Cloudflare Worker のシークレットを1件だけ更新する(他の変数には触れない)
          cf_secret() { # script name value
            if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ACCOUNT_ID" ]; then
              echo "Cloudflare credentials not found in OpenBao" >&2; return 1
            fi
            # Cloudflare の API(--cacert なし。システムの CA で検証する)
            CF_RESP=$(curl -s -X PUT -H "Authorization: Bearer $CF_API_TOKEN" \
              -H 'Content-Type: application/json' \
              -d "$(jq -n --arg n "$2" --arg v "$3" '{name:$n,text:$v,type:"secret_text"}')" \
              "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/scripts/$1/secrets")
            if ! jq -e '.success==true' >/dev/null 2>&1 <<<"$CF_RESP"; then
              echo "Cloudflare API error: $(jq -c '.errors' <<<"$CF_RESP" 2>/dev/null || echo 'no JSON response')" >&2
              return 1
            fi
          }

          write_target() {
            case "$TYPE" in
              oidc) oidc_update "$P" "$NEW" ;;
              cf)   cf_secret "$P" "$KEY" "$NEW" ;;
              *)    kv_patch "$P" "$KEY" "$NEW" "$PREV" ;;
            esac
          }

          FAIL=0
          while IFS='|' read -r NAME TYPE P KEY; do
            NAME=$(echo "$NAME" | xargs)
            [ -z "$NAME" ] && continue
            if [ -n "${ONLY:-}" ] && [ "$ONLY" != "$NAME" ]; then continue; fi
            echo "== $NAME ($MODE)"

            if ! APP=$(get_app "$NAME"); then
              echo "::error::$NAME: Casdoor get-application failed"; FAIL=1; continue
            fi
            OLD=$(jq -r .clientSecret <<<"$APP")
            echo "::add-mask::$OLD"

            if [ "$MODE" = rotate ]; then
              NEW=$(openssl rand -hex 20); echo "::add-mask::$NEW"; PREV="$OLD"
              if ! put_app "$NAME" "$(jq -c --arg s "$NEW" '.clientSecret=$s' <<<"$APP")" \
                 || [ "$(get_app "$NAME" | jq -r .clientSecret)" != "$NEW" ]; then
                echo "::error::$NAME: Casdoor update failed, restoring"
                put_app "$NAME" "$APP" || true
                FAIL=1; continue
              fi
            else
              NEW="$OLD"; PREV=""
            fi

            if ! write_target; then
              echo "::error::$NAME: write failed ($TYPE)"
              if [ "$MODE" = rotate ]; then
                echo "restoring Casdoor to the previous secret"
                put_app "$NAME" "$APP" || echo "::error::$NAME: RESTORE FAILED - fix manually"
              fi
              FAIL=1; continue
            fi
            echo "$NAME: done"
          done <<< "$APPS"

          exit $FAIL

      - name: Disconnect NetBird
        if: always()
        run: sudo netbird down >/dev/null 2>&1 || true
