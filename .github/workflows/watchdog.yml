name: casdoor watchdog

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - name: Check health
        id: check
        run: |
          CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 \
            https://auth.jyrac.stki.org/api/health) || CODE="000"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Trigger redeploy if unhealthy
        if: steps.check.outputs.code == '503' || steps.check.outputs.code == '000'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CODE="${{ steps.check.outputs.code }}"
          LAST=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/JYRAC/casdoor/actions/workflows/deploy-secrets.yml/runs?per_page=1" \
            | jq -r '.workflow_runs[0].created_at // empty')

          AGE=999999
          if [ -n "$LAST" ]; then
            AGE=$(( $(date +%s) - $(date -d "$LAST" +%s) ))
          fi

          if [ "$AGE" -lt 900 ]; then
            echo "::error::casdoor returned HTTP $CODE, but the last deploy ran ${AGE}s ago (<900s). Skipping redeploy to avoid a deploy storm."
            exit 1
          fi

          echo "::error::casdoor returned HTTP $CODE - triggered redeploy, please check why it went down"
          curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/JYRAC/casdoor/actions/workflows/deploy-secrets.yml/dispatches" \
            -d '{"ref":"main"}'
          exit 1
