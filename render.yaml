services:
  - type: web
    name: casdoor
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: GIN_MODE
        value: release
      # ゲートの公開ポート。以前の検出（8000）と同じにしておく（変えると、Render がデプロイを再起動して、
      # 使用済みのラップトークンで、起動に失敗する）
      - key: PORT
        value: "8000"
      - key: origin
        value: "https://auth.jyrac.stki.org"
      # JSON は、シングルクォートで囲む（ダブルクォートの中にダブルクォートを入れると、YAML として壊れる）
      - key: logConfig
        value: '{"adapter":"console","level":7,"color":false}'
      # ---- NetBird（OpenBao へ、NetBird 経由で接続し、固定のピアに切り替える）----
      # NB_SETUP_KEY（仮のピアの、使い捨てキー）は、deploy-secrets.yml が、デプロイのたびに作って渡すので、ここには書かない。
      # 固定のピアの設定（netbird_config_b64）は、OpenBao の kv/secrets/casdoor/config から受け取る。
      - key: NB_HOSTNAME
        value: "casdoor"
      - key: OPENBAO_NB_ADDR
        value: "https://100.125.124.43:8210"
      # ---- IPゲート（GATE_DB_USER / GATE_DB_PASSWORD は、Agent が出すので、ここには書かない）----
      # GATE_CHILD_CMD / GATE_UPSTREAM / GATE_UPSTREAM_HEALTH_PATH / GATE_INTERNAL_* は、Dockerfile で設定済み
      # 観察（observe）から始める。全クライアントが内部口に移ってから、enforce にする（C6）
      - key: GATE_MODE
        value: "observe"
      - key: GATE_DB_HOST
        value: "aws-0-us-west-2.pooler.supabase.com"
      - key: GATE_DB_PORT
        value: "6543"
      - key: GATE_DB_NAME
        value: "postgres"
      - key: GATE_DB_SSLMODE
        value: "require"
      - key: GATE_DENIED_URL
        value: "https://gate.jyrac.stki.org/denied"
      - key: GATE_REDIRECT_URL
        value: "https://gate.jyrac.stki.org/"
