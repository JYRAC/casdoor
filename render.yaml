services:
  - type: web
    name: casdoor
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: GIN_MODE
        value: release
      - key: origin
        value: "https://auth.jyrac.stki.org"
      - key: logConfig
        value: "{"adapter":"console","level":7,"color":false}"
